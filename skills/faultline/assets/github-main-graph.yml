name: Faultline main graph

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a pinned Faultline commit
        env:
          FAULTLINE_REF: ${{ vars.FAULTLINE_REF }}
        run: python3 -c 'import os,re; assert re.fullmatch(r"[0-9a-f]{40}", os.environ["FAULTLINE_REF"]), "Set FAULTLINE_REF to a published Faultline commit SHA"'
      - uses: actions/checkout@v7
        with:
          repository: ronaldtebrake/faultline
          ref: ${{ vars.FAULTLINE_REF }}
          token: ${{ secrets.FAULTLINE_READ_TOKEN || github.token }}
          path: .faultline/tool
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the pinned engine and graph producer
        run: |
          python -m pip install ./.faultline/tool
          npm install --global @colbymchenry/codegraph@1.6.0
      - name: Build the exact main revision
        run: faultline graph build --revision HEAD --fresh --output .faultline/main-graph
      - uses: actions/upload-artifact@v7
        with:
          name: faultline-main-graph-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .faultline/main-graph/graph.sqlite
            .faultline/main-graph/manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
