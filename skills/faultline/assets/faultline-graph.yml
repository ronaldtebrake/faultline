# Keep existing full test jobs unchanged. No consumer helper scripts are needed.
name: Faultline source graph
on:
  pull_request:
  push:
permissions:
  contents: read
  actions: read
jobs:
  graph:
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Replace with the reviewed full commit containing actions/graph.
      - uses: ronaldtebrake/faultline/actions/graph@4619f39b0b8bb42486b1c3b7385bea12907728e5
        with:
          base-ref: ${{ github.event.pull_request.base.sha || github.sha }}
          trusted-branch: ${{ github.event.repository.default_branch }}
          publish-baseline: ${{ github.event_name == 'push' }}
