# Copy as .github/workflows/faultline-graph.yml beside existing full test checks.
# Review/update the full setup-action SHA when adopting a different engine.
name: Faultline source graph
on:
  pull_request:
  push:
permissions:
  contents: read
  actions: read
jobs:
  graph:
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ronaldtebrake/faultline/actions/setup@103a0cda8d0f4ada5eb37f8a52911261f3959628
      - name: Restore a trusted ancestor baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRUSTED_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p .faultline/ci-graph
          "$FAULTLINE_CLI" graph baseline fetch --repository "$REPOSITORY" \
            --workflow faultline-graph.yml --branch "$TRUSTED_BRANCH" \
            --output "$RUNNER_TEMP/faultline-baseline.json" > .faultline/ci-graph/restore.json
      - name: Build readable source graph
        run: |
          "$FAULTLINE_CLI" init
          "$FAULTLINE_CLI" graph build --output .faultline/ci-graph/graph.json > .faultline/ci-graph/build.json
      - name: Explain actual PR changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base=$(git merge-base "$BASE_SHA" HEAD)
          "$FAULTLINE_CLI" graph compare --base "$base" --head HEAD > .faultline/ci-graph/impact.json
      - name: Package source facts from the default branch
        if: github.event_name == 'push'
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          value = {'repository': os.environ['REPOSITORY'].lower(),
                   'repository_id': int(os.environ['REPOSITORY_ID']),
                   'workflow': 'faultline-graph.yml', 'revision': os.environ['GITHUB_SHA'],
                   'run_id': int(os.environ['GITHUB_RUN_ID']),
                   'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
                   'event': 'push', 'branch': os.environ['GITHUB_REF_NAME'], 'collections': []}
          (Path(os.environ['RUNNER_TEMP']) / 'faultline-producer.json').write_text(json.dumps(value))
          PYTHON
          "$FAULTLINE_CLI" graph baseline pack --producer "$RUNNER_TEMP/faultline-producer.json" \
            --output .faultline/baseline.json > .faultline/ci-graph/package.json
      - uses: actions/upload-artifact@v6
        if: github.event_name == 'push'
        with:
          name: faultline-baseline-v1
          path: .faultline/baseline.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: faultline-graph-${{ github.run_id }}-${{ github.run_attempt }}
          path: .faultline/ci-graph/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
