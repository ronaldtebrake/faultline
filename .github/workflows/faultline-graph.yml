# Exercise the packaged consumer integration against committed synthetic source.
name: Faultline installation and graph self-test
on:
  pull_request:
  push:
    branches: [codex/graph-default]
permissions:
  contents: read
  actions: read
jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify offline defaults and packaged CI behavior
        env:
          PYTHONPATH: skills/faultline/scripts:tests
        run: python3 -m unittest test_graph_assessment test_graph_ci -q
      - name: Configure the committed synthetic source fixture
        run: cp .github/faultline-fixture.json faultline.json
      - uses: ./actions/graph
        with:
          base-ref: ${{ github.event.pull_request.base.sha || github.sha }}
          trusted-branch: codex/graph-default
          publish-baseline: ${{ github.event_name == 'push' }}
