[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "faultline-cli"
version = "0.1.0"
description = "CodeGraph and Jev test impact analysis for CI and coding agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
faultline = "faultline.cli:main"

[tool.setuptools.packages.find]
where = ["skills/faultline/scripts"]
include = ["faultline*"]

[tool.setuptools.package-data]
"faultline.tia" = ["*.php"]
