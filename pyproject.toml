[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "faultline-cli"
version = "0.1.0"
description = "Deterministic core for Faultline agent-native semantic test ranking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
faultline = "faultline.cli:main"

[tool.setuptools.packages.find]
where = ["skills/rank-tests/scripts"]
include = ["faultline*"]
