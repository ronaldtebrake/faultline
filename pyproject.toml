[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "faultline-cli"
version = "0.11.3"
description = "Dependency graph test impact assessment with optional Jev scoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
tls = ["certifi"]

[project.scripts]
faultline = "faultline.cli:main"

[tool.setuptools.packages.find]
where = ["skills/faultline/scripts"]
include = ["faultline*"]

[tool.setuptools.package-data]
"faultline.tia" = ["*.php", "*.mjs"]
